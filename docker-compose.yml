services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["./main", "migrate", "schema"]
    volumes:
      - ./etc/config.yaml:/app/etc/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      - ENV=${ENV:-docker}
      - DEBUG=${DEBUG:-false}
      - DB_HOST=${DB_HOST:?set DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:?set DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME:?set DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gin-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gin-biz-web-api
    env_file:
      - .env
    expose:
      - "8501"
    volumes:
      - ./storage:/app/storage
      - ${EXCEL_TEMP_HOST_DIR:-./storage/tmp/data-warehouse-excel}:${DATA_WAREHOUSE_EXCEL_TEMP_DIR:-/data/data-warehouse-excel}
      - ./app.log:/app/app.log
      - ./etc/config.yaml:/app/etc/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      - ENV=${ENV:-docker}
      - DEBUG=${DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_PORT=${APP_PORT:-8501}
      - GIN_MODE=${GIN_MODE:-release}
      - SSL_ENABLED=${SSL_ENABLED:-false}
      - DB_HOST=${DB_HOST:?set DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:?set DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME:?set DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - REPORT_CREDENTIAL_KEY_VERSION=${REPORT_CREDENTIAL_KEY_VERSION:-}
      - REPORT_CREDENTIAL_KEYS_JSON=${REPORT_CREDENTIAL_KEYS_JSON:-}
      - REPORT_PARAMETER_KEY_VERSION=${REPORT_PARAMETER_KEY_VERSION:-}
      - REPORT_PARAMETER_KEYS_JSON=${REPORT_PARAMETER_KEYS_JSON:-}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ALIYUN_SMS_ACCESS_KEY_ID=${ALIYUN_SMS_ACCESS_KEY_ID:-}
      - ALIYUN_SMS_ACCESS_KEY_SECRET=${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE:-}
      - ALIYUN_SMS_ENDPOINT=${ALIYUN_SMS_ENDPOINT:-dysmsapi.aliyuncs.com}
      - DATA_WAREHOUSE_EXCEL_TEMP_DIR=${DATA_WAREHOUSE_EXCEL_TEMP_DIR:-/data/data-warehouse-excel}
      - AUTO_MIGRATE_ON_STARTUP=${AUTO_MIGRATE_ON_STARTUP:-false}
      - REPORT_CENTER_ENABLED=${REPORT_CENTER_ENABLED:-true}
      - REPORT_WORKER_ENABLED=${REPORT_WORKER_ENABLED:-true}
      - REPORT_RUN_WORKER_CONCURRENCY=${REPORT_RUN_WORKER_CONCURRENCY:-4}
      - REPORT_EXPORT_WORKER_CONCURRENCY=${REPORT_EXPORT_WORKER_CONCURRENCY:-2}
      - MALL_WEATHER_REPAIR_ENABLED=${MALL_WEATHER_REPAIR_ENABLED:-false}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8501/api/ready"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gin-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gin-biz-web
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - gin-network

networks:
  gin-network:
    driver: bridge
